[workspace]
members = [
    "crates/smagical-core",
    "crates/smagical-storage",
    "crates/smagical-ssh",
    "crates/smagical-ui-view",
    "crates/smagical-ui",
    "crates/smalux-cli",
    "crates/ui/common",
    "crates/ui/kernel",
    "crates/ui/plugins/hosts",
    "crates/ui/plugins/session_tools",
    "crates/ui/plugins/snippets",
    "crates/ui/plugins/tunnels",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["smagical"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
regex = "1.13.1"
slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-skia",
    "renderer-skia-opengl",
    "unstable-winit-030",
] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hmac = "0.12"
chrono = { version = "0.4", features = ["serde"] }

slint-build = "1.18.1"
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "time", "json"] }
tracing-appender = "0.2.5"
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
fontdue = "0.9.4"
arboard = "3.6.1"
vt100 = "0.16.2"
tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.89"
winit = { version = "0.30", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rfd = "0.17.2"

[profile.dev]
# 降低局部变量调试符号（保留 panic 行号与堆栈追踪），显著降低 PDB 体积和 MSVC 磁盘写入耗时
debug = 1

# Slint 自动生成的大型 UI AST 无需调试符号，彻底避免 LLVM 编译期 Out of Memory
[profile.dev.package.smagical-ui-view]
debug = 0

[profile.test.package.smagical-ui-view]
debug = 0

[profile.release]
# 自动剥离调试符号，极大压缩发布包体积并减少打包磁盘占用
strip = true
opt-level = 3
lto = "thin"
codegen-units = 1
