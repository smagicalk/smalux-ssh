[workspace]
members = [
    "crates/smagical-core",
    "crates/smagical-storage",
    "crates/smagical-ssh",
    "crates/smagical-ui",
    "crates/smalux-cli",
    "crates/ui/common",
    "crates/ui/kernel",
    "crates/ui/plugins/hosts",
    "crates/ui/plugins/credentials",
    "crates/ui/plugins/files",
    "crates/ui/plugins/history",
    "crates/ui/plugins/snippets",
    "crates/ui/plugins/tunnels",
    "crates/ui/plugins/debug",
    "crates/ui/plugins/settings",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["smagical"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
regex = "1.13.1"
slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-skia",
    "renderer-skia-opengl",
    "unstable-winit-030",
] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.11"
hmac = "0.13"
chrono = { version = "0.4", features = ["serde"] }

slint-build = "1.18.1"
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "time", "json"] }
tracing-appender = "0.2.5"
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
fontdue = "0.9.4"
arboard = "3.6.1"
vt100 = "0.16.2"
tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.89"
winit = { version = "0.30", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rfd = "0.17.2"

# 数据库与密码学安全栈 (升级至最新 SeaORM 2.0 / AES-GCM 0.11 / Argon2 0.6 / Base64 0.23 / Rand 0.10)
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.23"
rand = "0.10"
log = "0.4"

# SSH 协议栈
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0"
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "rsa", "ecdsa", "p256", "getrandom", "std"] }

# CLI 控制台 TUI 栈
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
rpassword = "7.5"

# Windows 原生平台支持
windows-sys = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }

[profile.dev]
# 降低局部变量调试符号（保留 panic 行号与堆栈追踪），显著降低 PDB 体积和 MSVC 磁盘写入耗时
debug = 1
incremental = false

# Slint 自动生成的大型 UI AST 无需调试符号与断言分支，彻底避免 LLVM 编译期 Out of Memory
[profile.dev.package.smagical-ui-kernel]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.plugin-credentials]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.plugin-debug]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.plugin-files]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.plugin-history]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.plugin-hosts]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.plugin-settings]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.plugin-snippets]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.dev.package.plugin-tunnels]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.test.package.smagical-ui-kernel]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.test.package.plugin-credentials]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.test.package.plugin-debug]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.test.package.plugin-files]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.test.package.plugin-history]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.test.package.plugin-hosts]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.test.package.plugin-settings]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.test.package.plugin-snippets]
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16

[profile.test.package.plugin-tunnels]
debug = 0
debug-assertions = false
