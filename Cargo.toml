[workspace]
members = [
    "crates/smagical-core",
    "crates/smagical-ui",
    "crates/smagical-debug",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["smagical"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
slint = { version = "1.16.1", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-skia",
    "unstable-winit-030",
] }





slint-build = "1.16.1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "json"] }
tracing-appender = "0.2"
portable-pty = "0.8"
alacritty_terminal = "0.26"
fontdue = "0.9"
arboard = "3"
vt100 = "0.15"




