[package]
name = "smagicalssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace]
members = [
    ".",
    "crates/smagical-core",
    "crates/smagical-session",
    "crates/smagical-terminal",
    "crates/smagical-config",
    "crates/smagical-storage",
    "crates/smagical-security",
    "crates/smagical-backend-core",
    "crates/smagical-backend-reducer",
    "crates/smagical-local-backend",
    "crates/smagical-ssh-plan",
    "crates/smagical-ssh-client-core",
]
resolver = "3"

[dependencies]
smagical-backend-core = { path = "crates/smagical-backend-core" }
smagical-backend-reducer = { path = "crates/smagical-backend-reducer" }
smagical-config = { path = "crates/smagical-config" }
smagical-core = { path = "crates/smagical-core" }
smagical-security = { path = "crates/smagical-security" }
smagical-session = { path = "crates/smagical-session" }
smagical-storage = { path = "crates/smagical-storage" }
smagical-terminal = { path = "crates/smagical-terminal" }
smagical-local-backend = { path = "crates/smagical-local-backend" }
smagical-ssh-plan = { path = "crates/smagical-ssh-plan" }
smagical-ssh-client-core = { path = "crates/smagical-ssh-client-core" }
slint = { version = "1.16.1", features = ["unstable-winit-030"] }
sys-locale = "0.3.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
aws-lc-rs = { version = "1.16", features = ["prebuilt-nasm"] }
russh = { version = "0.55", default-features = false, features = ["aws-lc-rs", "flate2", "rsa"] }
russh-sftp = "2"
rfd = "0.17.2"

[build-dependencies]
slint-build = "1.16.1"
