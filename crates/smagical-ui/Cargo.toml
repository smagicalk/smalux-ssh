[package]
name = "smagical-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
slint.workspace = true
tracing.workspace = true
portable-pty.workspace = true
alacritty_terminal.workspace = true
fontdue.workspace = true
arboard.workspace = true
vt100.workspace = true
directories.workspace = true
uuid.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "time", "json"] }
tracing-appender.workspace = true
smagical-core = { path = "../smagical-core" }
smagical-storage = { path = "../smagical-storage" }
smagical-ui-view = { path = "../smagical-ui-view" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
winit = { version = "0.30", default-features = false }
rfd = "0.17.2"
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }

