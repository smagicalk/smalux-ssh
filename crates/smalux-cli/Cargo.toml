[package]
name = "smalux-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless CLI tool for Smalux: SSH management, remote operations, key generation, and tunnels"

[dependencies]
smagical-core = { path = "../smagical-core" }
smagical-ssh = { path = "../smagical-ssh" }
smagical-storage = { path = "../smagical-storage" }
clap = { workspace = true }
anyhow.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true }
directories = "6.0.0"
serde.workspace = true
serde_json.workspace = true
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
rpassword = "7.5"

