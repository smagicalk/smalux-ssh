[package]
name = "smagical-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
directories = "6"
redb = "3"
serde = { version = "1", features = ["derive"] }
smagical-config = { path = "../smagical-config" }
smagical-core = { path = "../smagical-core" }
thiserror = "2"
toml = "0.9"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
