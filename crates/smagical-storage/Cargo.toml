[package]
name = "smagical-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
directories = "6"
redb = "3"
sea-orm = { version = "2.0.0-rc", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0.0-rc", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
smagical-config = { path = "../smagical-config" }
smagical-core = { path = "../smagical-core" }
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
