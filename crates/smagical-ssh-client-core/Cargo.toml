[package]
name = "smagical-ssh-client-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
aws-lc-rs = { version = "1.16", features = ["prebuilt-nasm"] }
russh = { version = "0.55", default-features = false, features = ["aws-lc-rs", "flate2", "rsa"] }
smagical-core = { path = "../smagical-core" }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
